apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolldice-app
  labels:
    app: rolldice-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rolldice-app
  template:
    metadata:
      labels:
        app: rolldice-app
    spec:
      containers:
        - name: app
          image: rolldice-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: '3000'
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: rolldice-app
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
